# 错题猎手 - 知识点配置（数学）
#
# 这是知识点的唯一可编辑源头。后端启动时会幂等种子到数据库 knowledge_points 表
# （grade/domain/is_recommended/subject 编码进 keywords JSONB 列）。
# 修改本文件后重启后端即可生效。
#
# 注意：seeder 按 (name, grade, version) 去重。重命名一个知识点会新增一行并遗留旧行
# （旧错题仍关联到旧行）；如需真正重命名请手工处理数据库。
#
# grade: 31-34 小学三至六年级, 71-73 初中七至九年级
# domain: num 数与代数 / geo 图形与几何 / stat 统计与概率
# is_recommended: 该年级高频出错知识点（选择器中带 ✨）

