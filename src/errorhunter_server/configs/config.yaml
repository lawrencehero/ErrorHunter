# ErrorHunter Server Configuration

server:
  port: 8080
  mode: debug  # debug, release, test

database:
  host: localhost
  port: 5432
  user: errorhunter
  # ⚠️ 开发环境默认值，生产环境必须通过环境变量覆盖：EH_DATABASE_PASSWORD=<强密码>
  password: errorhunter_dev
  dbname: errorhunter
  sslmode: disable
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 300  # seconds

redis:
  addr: localhost:6379
  password: ""
  db: 0
  pool_size: 10

minio:
  endpoint: localhost:9000
  access_key: minioadmin
  secret_key: minioadmin123
  bucket: errorhunter
  region: us-east-1
  use_ssl: false

jwt:
  # ⚠️ 开发环境默认值，生产环境必须通过环境变量覆盖：
  # EH_JWT_ACCESS_SECRET=<随机64字符>
  # EH_JWT_REFRESH_SECRET=<随机64字符>
  access_secret: "errorhunter-access-secret-key-change-in-production"
  refresh_secret: "errorhunter-refresh-secret-key-change-in-production"
  access_expire: 15      # minutes
  refresh_expire: 10080  # minutes (7 days)

otp:
  expire: 300        # seconds (5 minutes)
  resend_interval: 60 # seconds
  daily_limit: 10
  max_retry: 5       # max wrong attempts before lockout
  lockout_duration: 1800 # seconds (30 minutes)
  # 验证码白名单：名单内手机号跳过真实短信发送与校验，任意验证码均可通过。
  # 仅用于测试/内部账号，生产环境必须留空。
  bypass_phones:
    - "REDACTED_PHONE"

sms:
  provider: aliyun
  aliyun:
    access_key: "REDACTED_AK"
    secret_key: "REDACTED_SK"
    endpoint: "dypnsapi.aliyuncs.com"
    sign_name: "速通互联验证码"
    template_code: "100001"
    template_param: '{"code":"##code##","min":"5"}'
    code_length: 0
    code_type: 0
    valid_time: 0

ocr:
  provider: aliyun
  timeout: 8
  aliyun:
    access_key: "REDACTED_AK"
    secret_key: "REDACTED_SK"
    endpoint: "ocr-api.cn-hangzhou.aliyuncs.com"

log:
  level: debug       # debug, info, warn, error
  format: json       # json, console
  output: stdout     # stdout, file
  file_path: "./logs/server.log"
