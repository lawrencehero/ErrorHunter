name: errorhunter_app
description: 错题猎手 - 小学3-6年级及初中学生错题全生命周期管理工具
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP & Network
  dio: ^5.5.0
  connectivity_plus: ^6.0.5

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^7.7.0

  # Navigation
  go_router: ^14.2.0

  # Local Storage
  sqflite: ^2.3.3
  shared_preferences: ^2.3.2

  # Image Handling
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  flutter_image_compress: ^2.3.0

  # Analytics
  firebase_analytics: ^11.2.0

  # Notifications
  flutter_local_notifications: ^17.2.1

  # PDF Generation
  pdf: ^3.11.0

  # Charts
  fl_chart: ^0.69.0

  # Reactive Extensions
  rxdart: ^0.28.0

  # Device Info
  device_info_plus: ^10.1.2

  # Crypto
  crypto: ^3.0.3

  # Internationalization
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Assets will be added in Phase 2
  # assets:
  #   - assets/images/
  #   - assets/icons/
  #   - assets/animations/
