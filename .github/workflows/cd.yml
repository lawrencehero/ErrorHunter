# ============================================================
# 错题猎手（ErrorHunter）CD 部署流水线
# 触发条件：push 到 main / 版本标签 / 手动触发
# ============================================================

name: CD

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: '部署目标环境'
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: '镜像标签（留空则使用最新 commit SHA）'
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/server
  GO_VERSION: "1.22"

jobs:
  # ==================== 构建并推送镜像 ====================
  build-and-push:
    name: 🏗️ 构建并推送镜像
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: 登录容器镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 构建并推送镜像
        id: build
        uses: docker/build-push-action@v6
        with:
          context: src/errorhunter_server
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.sha }}

  # ==================== 部署到 Staging ====================
  deploy-staging:
    name: 🚀 部署到 Staging
    needs: [build-and-push]
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.errorhunter.dev
    steps:
      - uses: actions/checkout@v4

      - name: 部署到 Staging 环境
        env:
          IMAGE_TAG: ${{ github.event.inputs.image_tag || github.sha }}
          DEPLOY_ENV: staging
        run: |
          echo "🚀 正在部署到 Staging 环境..."
          echo "镜像标签: $IMAGE_TAG"
          echo ""
          echo "⚠️  占位脚本 — 请替换为实际部署命令"
          echo "示例："
          echo "  ssh deploy@staging-server 'docker pull $IMAGE && docker compose up -d'"
          echo "  kubectl set image deployment/server server=$IMAGE_TAG"
          echo ""
          echo "✅ Staging 部署完成（占位）"

      - name: 等待服务就绪
        run: |
          echo "⏳ 等待 Staging 服务就绪..."
          # TODO: 替换为实际的健康检查 URL
          # for i in $(seq 1 30); do
          #   if curl -sf https://staging.errorhunter.dev/health; then
          #     echo "✅ 服务已就绪"
          #     exit 0
          #   fi
          #   sleep 2
          # done
          # echo "❌ 服务未就绪" && exit 1
          echo "✅ 服务就绪检查完成（占位）"

  # ==================== Staging 冒烟测试 ====================
  smoke-test:
    name: 💨 Staging 冒烟测试
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 运行冒烟测试
        env:
          BASE_URL: https://staging.errorhunter.dev
        run: |
          echo "💨 运行 Staging 冒烟测试..."
          echo ""
          echo "⚠️  占位脚本 — 请替换为实际冒烟测试"
          echo "示例："
          echo "  curl -sf \$BASE_URL/health"
          echo "  curl -sf \$BASE_URL/api/v1/version"
          echo "  # 运行专用冒烟测试套件"
          echo ""
          echo "✅ 冒烟测试通过（占位）"

  # ==================== 部署到 Production ====================
  deploy-production:
    name: 🎯 部署到 Production
    needs: [smoke-test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://api.errorhunter.dev
    steps:
      - uses: actions/checkout@v4

      - name: 部署到 Production 环境
        env:
          IMAGE_TAG: ${{ github.event.inputs.image_tag || github.sha }}
          DEPLOY_ENV: production
        run: |
          echo "🎯 正在部署到 Production 环境..."
          echo "镜像标签: $IMAGE_TAG"
          echo ""
          echo "⚠️  占位脚本 — 请替换为实际部署命令"
          echo "此步骤需要在 GitHub 仓库中配置 'production' 环境保护规则，"
          echo "并要求至少一名审批人批准后才能执行。"
          echo ""
          echo "✅ Production 部署完成（占位）"

      - name: 通知部署结果
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            echo "🎉 Production 部署成功！"
          else
            echo "❌ Production 部署失败，请立即检查！"
          fi
          # TODO: 接入钉钉/飞书/Slack 通知
          # curl -X POST "$WEBHOOK_URL" -d '{"text": "ErrorHunter 部署: '$STATUS'"}'
