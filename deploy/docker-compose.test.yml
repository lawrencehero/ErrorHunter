# ============================================================
# 错题猎手（ErrorHunter）测试专用 Docker Compose
# 用法：docker compose -f docker-compose.test.yml up --abort-on-container-exit --exit-code-from test-runner
# ============================================================

services:
  # ==================== PostgreSQL (测试库) ====================
  postgres-test:
    image: postgres:16-alpine
    container_name: errorhunter-postgres-test
    ports:
      - "${POSTGRES_TEST_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_TEST_DB:-errorhunter_test}
      POSTGRES_USER: ${POSTGRES_USER:-errorhunter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-errorhunter_dev}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    networks:
      - errorhunter-test-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-errorhunter} -d ${POSTGRES_TEST_DB:-errorhunter_test}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    tmpfs:
      - /var/lib/postgresql/data  # 使用内存存储，加速测试

  # ==================== Redis (测试) ====================
  redis-test:
    image: redis:7-alpine
    container_name: errorhunter-redis-test
    ports:
      - "${REDIS_TEST_PORT:-6380}:6379"
    networks:
      - errorhunter-test-net
    command: redis-server --save "" --appendonly no  # 不持久化，纯内存
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ==================== MinIO (测试) ====================
  minio-test:
    image: minio/minio:latest
    container_name: errorhunter-minio-test
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    networks:
      - errorhunter-test-net
    command: server /data --console-address ":9001"
    tmpfs:
      - /data  # 使用内存存储
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  # MinIO bucket 初始化
  minio-test-init:
    image: minio/mc:latest
    depends_on:
      minio-test:
        condition: service_healthy
    networks:
      - errorhunter-test-net
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio-test:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin123};
      mc mb local/${MINIO_BUCKET:-errorhunter} --ignore-existing;
      exit 0;
      "

  # ==================== Test Runner ====================
  test-runner:
    build:
      context: ../src/errorhunter_server
      dockerfile: ../../deploy/Dockerfile.test
    container_name: errorhunter-test-runner
    environment:
      CONFIG_PATH: /app/configs/config.yaml
      EH_SERVER_PORT: "8080"
      EH_SERVER_MODE: test
      EH_DATABASE_HOST: postgres-test
      EH_DATABASE_PORT: "5432"
      EH_DATABASE_USER: ${POSTGRES_USER:-errorhunter}
      EH_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-errorhunter_dev}
      EH_DATABASE_DBNAME: ${POSTGRES_TEST_DB:-errorhunter_test}
      EH_DATABASE_SSLMODE: disable
      EH_REDIS_ADDR: redis-test:6379
      EH_REDIS_PASSWORD: ""
      EH_MINIO_ENDPOINT: minio-test:9000
      EH_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      EH_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      EH_MINIO_BUCKET: ${MINIO_BUCKET:-errorhunter}
      EH_MINIO_USE_SSL: "false"
      EH_JWT_ACCESS_SECRET: test-access-secret
      EH_JWT_REFRESH_SECRET: test-refresh-secret
      EH_OTP_PROVIDER: mock
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      minio-test:
        condition: service_healthy
      minio-test-init:
        condition: service_completed_successfully
    networks:
      - errorhunter-test-net

networks:
  errorhunter-test-net:
    driver: bridge
