# ============================================================
# 错题猎手（ErrorHunter）生产环境编排
# 服务器：阿里云 ECS（IP 见同目录 .env 的 PUBLIC_HOST），部署目录 /opt/errorhunter
#
# 与开发环境（../docker-compose.yml）的区别：
#   - server 不在容器内编译源码（ECS 上 go mod download 被墙），
#     而是装入宿主机交叉编译好的 Linux 二进制（server-build/Dockerfile）
#   - postgres/redis/minio 端口只绑定 127.0.0.1，不暴露公网
#   - 额外运行 apk-server（8081 端口，APK 下载页）
#   - 敏感配置放同目录 .env（不进 Git），密钥为部署时随机生成
#
# 目录结构（服务器 /opt/errorhunter/）：
#   docker-compose.yml  .env  init-db.sql
#   server-build/  (Dockerfile + server 二进制 + configs/)
#   apk-server/    (Dockerfile + apk_server.py)
#   apk/           (app-release.apk + pubspec.yaml，volume 挂载)
#
# 常用操作：
#   docker compose up -d --build     # 上线/更新
#   docker compose logs -f server    # 看后端日志
#   docker compose ps                # 健康状态
#   回滚：换回旧 server 二进制后 docker compose up -d --build server
# ============================================================

services:
  # ==================== PostgreSQL ====================
  postgres:
    image: postgres:16-alpine
    container_name: errorhunter-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-errorhunter}
      POSTGRES_USER: ${POSTGRES_USER:-errorhunter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    networks:
      - errorhunter-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-errorhunter} -d ${POSTGRES_DB:-errorhunter}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==================== Redis ====================
  redis:
    image: redis:7-alpine
    container_name: errorhunter-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    networks:
      - errorhunter-net
    command: >
      redis-server
      --appendonly yes
      --save 60 1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==================== MinIO (S3-compatible) ====================
  minio:
    image: minio/minio:latest
    container_name: errorhunter-minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - miniodata:/data
    networks:
      - errorhunter-net
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # MinIO bucket 初始化
  minio-init:
    image: minio/mc:latest
    container_name: errorhunter-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - errorhunter-net
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD};
      mc mb local/${MINIO_BUCKET:-errorhunter} --ignore-existing;
      echo 'MinIO bucket initialized';
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

  # ==================== Go Backend ====================
  # 二进制在本地宿主机交叉编译（GOOS=linux GOARCH=amd64）后上传到
  # server-build/server，容器内不做 go build —— 规避服务器被墙。
  server:
    build:
      context: ./server-build
      dockerfile: Dockerfile
    image: errorhunter/server:latest
    container_name: errorhunter-server
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - errorhunter-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ==================== APK 下载服务器 ====================
  apk-server:
    build: ./apk-server
    image: errorhunter/apk-server:latest
    container_name: errorhunter-apk-server
    restart: unless-stopped
    ports:
      - "${APK_PORT:-8081}:8081"
    environment:
      APK_PORT: 8081
      APK_APK_PATH: /data/app-release.apk
      APK_PUBSPEC_PATH: /data/pubspec.yaml
      PUBLIC_URL: http://${PUBLIC_HOST:-localhost}:8081
      APK_QR_OUTPUT: /data/apk-download-qr.png
    volumes:
      - ./apk:/data
    networks:
      - errorhunter-net

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  miniodata:
    driver: local

networks:
  errorhunter-net:
    driver: bridge
